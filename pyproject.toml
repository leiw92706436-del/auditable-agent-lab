[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "auditable-agent-lab"
version = "0.1.0"
description = "Fail-closed action gates and tamper-evident evidence for autonomous agents."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Auditable Agent Lab contributors" },
]
keywords = [
    "agent-governance",
    "auditability",
    "fail-closed",
    "evidence",
    "provenance",
    "release-gate",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
auditable-agent-lab = "auditable_agent_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["auditable_agent_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
