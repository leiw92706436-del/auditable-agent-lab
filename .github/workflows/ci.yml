name: Public core CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: public-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"

jobs:
  test-build-install:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pinned test and build tools
        run: python -m pip install "pytest==9.0.3" "setuptools==82.0.1"

      - name: Run public synthetic suite
        run: python -m pytest -q tests/auditable_agent_lab

      - name: Build wheel
        run: python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist .

      - name: Install wheel in a fresh environment
        run: |
          python -m venv .ci-venv
          .ci-venv/bin/python -m pip install --no-index dist/*.whl
          env -u PYTHONPATH .ci-venv/bin/python -c "import auditable_agent_lab"
          env -u PYTHONPATH .ci-venv/bin/python -m auditable_agent_lab --help
          env -u PYTHONPATH .ci-venv/bin/auditable-agent-lab --help
          env -u PYTHONPATH .ci-venv/bin/python examples/synthetic_release_gate/run_example.py
          env -u PYTHONPATH .ci-venv/bin/python examples/synthetic_research/run_example.py
          .ci-venv/bin/python -m pip check

      - name: Inspect wheel boundary
        run: |
          WHEEL_PATH="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          WHEEL_PATH="$WHEEL_PATH" .ci-venv/bin/python - <<'PY'
          from importlib.metadata import requires
          from pathlib import Path
          from zipfile import ZipFile
          import os

          wheel = Path(os.environ["WHEEL_PATH"])
          if not wheel.is_file():
              raise SystemExit("wheel not found")
          with ZipFile(wheel) as archive:
              members = sorted(archive.namelist())
          unexpected = [
              item
              for item in members
              if not item.startswith("auditable_agent_lab/")
              and ".dist-info/" not in item
          ]
          if unexpected:
              raise SystemExit(f"unexpected wheel members: {unexpected}")
          if requires("auditable-agent-lab"):
              raise SystemExit("runtime dependencies were added")
          print(f"wheel_members={len(members)}")
          PY

      - name: Confirm the working tree remains clean
        run: test -z "$(git status --porcelain)"
